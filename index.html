<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><title>مدیریت مشتریان</title>
<style>
:root{--blue:#1565c0;--blue2:#0d47a1;--bg:#f4f8fc;--card:#fff;--text:#17324d;--muted:#6b7b8c;--border:#d9e4ef;--danger:#c62828;font-size:16px}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:1rem}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;padding:18px 16px 20px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0002}
.top h1{margin:0 0 12px;font-size:1.35rem}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:190px;padding:11px 13px;border-radius:10px;border:0;outline:0;background:#fff;color:#123}
.btn{padding:10px 13px;border-radius:10px;background:#fff;color:var(--blue2);font-weight:bold}.btn.primary{background:var(--blue);color:white}.btn.ghost{background:#e9f2ff}.btn.danger{background:#ffebee;color:var(--danger)}
main{padding:14px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--border);padding:12px 15px;border-radius:12px;min-width:140px}.stat b{display:block;font-size:1.35rem;color:var(--blue)}
.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.check{width:22px;height:22px;margin-top:4px}.name{font-weight:bold;font-size:1.08rem}.meta{color:var(--muted);font-size:.9rem;margin-top:5px;line-height:1.8}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.iconbtn{padding:9px 10px;border-radius:9px;background:#edf5ff;color:var(--blue2)}.empty{text-align:center;padding:45px 20px;color:var(--muted);background:#fff;border-radius:14px;border:1px dashed var(--border)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:white;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheet h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:.9rem;margin-bottom:5px;font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;outline:none;background:white}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17324d;color:white;padding:11px 16px;border-radius:10px;display:none;z-index:40}
.overlay{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;z-index:50}.overlay.show{display:flex}.pinbox{width:min(360px,90%);text-align:center}.pinbox input{width:100%;padding:14px;text-align:center;letter-spacing:8px;font-size:1.4rem;border:1px solid var(--border);border-radius:12px;margin:12px 0}.muted{color:var(--muted);font-size:.9rem}
@media(max-width:650px){.grid{grid-template-columns:1fr}.card{grid-template-columns:auto 1fr}.actions{grid-column:2;justify-content:flex-start}.top{position:relative}}
</style></head>
<body>
<div class="app">
<header class="top"><h1>مدیریت مشتریان</h1>
<div class="tools"><input id="search" placeholder="جستجو نام، کد ملی یا شماره تماس…"><button class="btn" id="addBtn">＋ مشتری جدید</button><button class="btn" id="settingsBtn">⚙ تنظیمات</button></div></header>
<main><div class="summary"><div class="stat">کل مشتریان<b id="count">۰</b></div><div class="stat">انتخاب‌شده<b id="selectedCount">۰</b></div></div>
<div class="tools" style="margin-bottom:12px"><button class="btn ghost" id="selectAll">انتخاب همه</button><button class="btn ghost" id="smsBtn">✉ پیام گروهی</button><button class="btn ghost" id="exportBtn">⬇ خروجی</button><button class="btn ghost" id="importBtn">⬆ ورود اطلاعات</button><input type="file" id="fileInput" accept=".json,.csv" hidden></div>
<div id="list" class="list"></div></main>
</div>

<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">مشتری جدید</h2><form id="form"><div class="grid">
<div class="field"><label>نام و نام خانوادگی *</label><input id="name" required></div>
<div class="field"><label>شماره ملی</label><input id="nationalId" inputmode="numeric" maxlength="10"></div>
<div class="field"><label>شماره تماس *</label><input id="phone" inputmode="tel" required></div>
<div class="field"><label>تاریخ ثبت</label><input id="date" type="date"></div>
<div class="field full"><label>یادداشت</label><textarea id="notes"></textarea></div></div>
<div class="modal-actions"><button class="btn primary" type="submit">ذخیره</button><button class="btn" type="button" id="cancelBtn">انصراف</button></div></form></div></div>

<div class="modal" id="settings"><div class="sheet"><h2>تنظیمات</h2><div class="field"><label>اندازه فونت</label><select id="fontSize"><option value="14">کوچک</option><option value="16">متوسط</option><option value="18">بزرگ</option><option value="21">خیلی بزرگ</option></select></div>
<div class="modal-actions"><button class="btn primary" id="saveSettings">ذخیره</button><button class="btn" id="closeSettings">بستن</button></div></div></div>

<div class="overlay" id="pinOverlay"><div class="pinbox"><h2>🔐 ورود به برنامه</h2><div class="muted">برای ورود، رمز PIN را وارد کنید.</div><input id="pinInput" type="password" inputmode="numeric" maxlength="6"><button class="btn primary" id="pinSubmit">ورود</button><p class="muted" id="pinHint"></p></div></div>
<div class="toast" id="toast"></div>

<script>
const DB='customers-pwa', STORE='customers'; let db, customers=[], editing=null, selected=new Set();
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
async function load(){customers=await new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});render()}
function save(c){return new Promise((res,rej)=>{let r=tx('readwrite').put(c);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function fa(n){return new Intl.NumberFormat('fa-IR').format(n)}
function render(){let q=$('search').value.trim().toLowerCase();let arr=customers.filter(c=>[c.name,c.nationalId,c.phone].join(' ').toLowerCase().includes(q));$('count').textContent=fa(customers.length);$('selectedCount').textContent=fa(selected.size);$('list').innerHTML=arr.length?arr.map(c=>`<div class="card"><input class="check" type="checkbox" data-sel="${c.id}" ${selected.has(c.id)?'checked':''}>
<div class="customer-main"><div class="customer-head"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${esc((c.name||'م').trim().charAt(0))}</div><div><div class="name">${esc(c.name)}</div><div class="meta" style="margin-top:2px">کد مشتری: ${esc(c.id.slice(0,8))}</div></div></div></div>
<div class="info-grid"><div class="info"><small>📱 شماره تماس</small><span>${esc(c.phone||'—')}</span></div><div class="info"><small>🪪 کد ملی</small><span>${esc(c.nationalId||'—')}</span></div><div class="info"><small>📅 تاریخ ثبت</small><span>${esc(c.date||'—')}</span></div></div>
${c.notes?`<div class="meta" style="margin-top:9px">📝 ${esc(c.notes)}</div>`:''}
<div class="actions"><button class="iconbtn" data-call="${c.phone}">📞 تماس</button><button class="iconbtn" data-edit="${c.id}">✏ ویرایش</button><button class="iconbtn" data-del="${c.id}">🗑 حذف</button></div></div></div>`).join(''):`<div class="empty">هنوز مشتری ثبت نشده یا نتیجه‌ای پیدا نشد.</div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openForm(c){editing=c?.id||null;$('modalTitle').textContent=editing?'ویرایش مشتری':'مشتری جدید';$('name').value=c?.name||'';$('nationalId').value=c?.nationalId||'';$('phone').value=c?.phone||'';$('date').value=c?.date||new Date().toISOString().slice(0,10);$('notes').value=c?.notes||'';$('modal').classList.add('show');setTimeout(()=>$('name').focus(),100)}
$('form').onsubmit=async e=>{e.preventDefault();let c={id:editing||crypto.randomUUID(),name:$('name').value.trim(),nationalId:$('nationalId').value.trim(),phone:$('phone').value.trim(),date:$('date').value,notes:$('notes').value.trim()};await save(c);$('modal').classList.remove('show');await load();toast('ذخیره شد')};
$('cancelBtn').onclick=()=>$('modal').classList.remove('show');$('addBtn').onclick=()=>openForm();$('search').oninput=render;
$('list').onclick=async e=>{let b=e.target;if(b.dataset.call)location.href='tel:'+b.dataset.call;if(b.dataset.edit)openForm(customers.find(c=>c.id===b.dataset.edit));if(b.dataset.del){if(confirm('این مشتری حذف شود؟')){await del(b.dataset.del);selected.delete(b.dataset.del);await load();toast('حذف شد')}}};
$('list').onchange=e=>{if(e.target.dataset.sel){let id=e.target.dataset.sel;e.target.checked?selected.add(id):selected.delete(id);render()}};
$('selectAll').onclick=()=>{let q=$('search').value.trim().toLowerCase();customers.filter(c=>[c.name,c.nationalId,c.phone].join(' ').toLowerCase().includes(q)).forEach(c=>selected.add(c.id));render()};
$('smsBtn').onclick=()=>{let arr=customers.filter(c=>selected.has(c.id)&&c.phone);if(!arr.length)return toast('ابتدا مشتری انتخاب کنید');let body=prompt('متن پیام را وارد کنید:');if(body!==null)location.href='sms:'+arr.map(c=>c.phone).join(',')+'?body='+encodeURIComponent(body)};
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exportBtn').onclick=()=>download('customers-backup.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),customers},null,2),'application/json');
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();try{let data;if(f.name.toLowerCase().endsWith('.json'))data=JSON.parse(t).customers||JSON.parse(t);else{let lines=t.split(/\r?\n/).filter(Boolean),h=lines.shift().split(',').map(x=>x.trim());data=lines.map(line=>{let v=line.split(',');return Object.fromEntries(h.map((k,i)=>[k,v[i]||'']))})}if(!Array.isArray(data))throw 0;for(let c of data){if(!c.id)c.id=crypto.randomUUID();await save({...c,name:c.name||c['نام و نام خانوادگی']||'',nationalId:c.nationalId||c['شماره ملی']||'',phone:c.phone||c['شماره تماس']||''})}await load();toast('اطلاعات وارد شد')}catch(err){toast('فایل قابل خواندن نیست')}e.target.value=''};

$('settingsBtn').onclick=()=>{$('fontSize').value=getComputedStyle(document.documentElement).fontSize.replace('px','');$('settings').classList.add('show')};
$('closeSettings').onclick=()=>$('settings').classList.remove('show');$('saveSettings').onclick=()=>{localStorage.fontSize=$('fontSize').value;document.documentElement.style.fontSize=localStorage.fontSize+'px';$('settings').classList.remove('show');toast('تنظیمات ذخیره شد')};
$('lockBtn').onclick=()=>{sessionStorage.removeItem('unlocked');$('settings').classList.remove('show');checkPin()};
async function init(){document.documentElement.style.fontSize=(localStorage.fontSize||16)+'px';await openDB();await load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');}
init();
</script></body></html>
